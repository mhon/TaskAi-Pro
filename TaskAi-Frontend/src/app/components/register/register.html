<div class="login-wrapper">
  <div class="login-card">
    <h2>Create Account</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" />
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="error-msg">
          Valid email is required.
        </div>
      </div>

      <div class="form-group">
        <label>User name</label>
        <input type="text" formControlName="fullName" />
        <div *ngIf="registerForm.get('fullName')?.invalid && registerForm.get('fullName')?.touched" class="error-msg">
          User name is required.
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" />
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="error-msg">
          <small *ngIf="registerForm.get('password')?.errors?.['required']">Password is required.</small>
          <small *ngIf="registerForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</small>
        </div>
      </div>

      <div *ngIf="errorMessage" class="server-error-box">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="btn-login">Register</button>
    </form>
    <div class="footer-links">
      <span>Already have an account?</span>
      <a routerLink="/login">Login here</a>
    </div>
  </div>
</div>
